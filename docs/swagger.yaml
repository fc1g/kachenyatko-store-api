basePath: /
definitions:
  Category:
    properties:
      created_at:
        format: date-time
        type: string
      id:
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        format: uuid
        type: string
      name:
        example: Soft toys
        type: string
      slug:
        description: URL-friendly identifier generated from the name
        example: soft-toys
        type: string
      updated_at:
        format: date-time
        type: string
    type: object
  CategoryInput:
    properties:
      name:
        description: Category name; the slug is generated from it
        example: Soft toys
        maxLength: 100
        minLength: 1
        type: string
    required:
    - name
    type: object
  CategoryPage:
    properties:
      items:
        items:
          $ref: '#/definitions/Category'
        type: array
      total:
        description: Total number of categories, across all pages
        example: 27
        minimum: 0
        type: integer
    type: object
  CreateOrderInput:
    properties:
      details:
        description: Description of what the customer wants; required for custom orders
          without a toy
        example: A grey rabbit, about 25cm tall with long ears
        maxLength: 2000
        type: string
      message:
        description: Optional comment for any order
        example: Would like it in blue, please
        maxLength: 500
        type: string
      phone:
        description: Customer phone number in international format
        example: "+380671234567"
        type: string
    required:
    - phone
    type: object
  ErrorResponse:
    properties:
      code:
        description: Machine-readable error code
        enum:
        - INVALID
        - UNAUTHORIZED
        - FORBIDDEN
        - NOT_FOUND
        - CONFLICT
        - PAYLOAD_TOO_LARGE
        - TOO_MANY_REQUESTS
        - INTERNAL
        example: NOT_FOUND
        type: string
      message:
        description: Human-readable error message
        example: category not found
        type: string
    type: object
  HealthResponse:
    properties:
      status:
        enum:
        - OK
        - Service Unavailable
        example: OK
        type: string
    type: object
  LoginInput:
    properties:
      email:
        description: Email, case-insensitive
        example: user@example.com
        format: email
        maxLength: 254
        type: string
      password:
        example: S3cureP@ssw0rd
        format: password
        maxLength: 128
        type: string
    required:
    - email
    - password
    type: object
  Order:
    properties:
      created_at:
        format: date-time
        type: string
      details:
        example: Would like it in blue, please
        type: string
      id:
        example: 5d2c7b1a-3e4f-4a6b-9c8d-1e2f3a4b5c6d
        format: uuid
        type: string
      message:
        example: Please contact me via Telegram rather than calling
        type: string
      phone:
        example: "+380671234567"
        type: string
      status:
        enum:
        - open
        - closed
        example: open
        type: string
      toy_id:
        description: Ordered toy; null for custom orders
        example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        format: uuid
        type: string
        x-nullable: true
      updated_at:
        format: date-time
        type: string
    type: object
  OrderPage:
    properties:
      items:
        items:
          $ref: '#/definitions/Order'
        type: array
      total:
        description: Total number of orders, across all pages
        example: 46
        minimum: 0
        type: integer
    type: object
  Toy:
    properties:
      category:
        $ref: '#/definitions/ToyCategory'
      created_at:
        format: date-time
        type: string
      description:
        example: Soft plush bear, safe for children from 3 years
        type: string
      id:
        example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        format: uuid
        type: string
      images:
        items:
          $ref: '#/definitions/ToyImage'
        type: array
      materials:
        example: Cotton, polyester filling
        type: string
      name:
        example: Teddy bear
        type: string
      size:
        description: Free-form size, e.g. dimensions in centimeters
        example: 25x15 cm
        type: string
      updated_at:
        format: date-time
        type: string
    type: object
  ToyCategory:
    properties:
      id:
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        format: uuid
        type: string
      name:
        example: Soft toys
        type: string
      slug:
        example: soft-toys
        type: string
    type: object
  ToyImage:
    properties:
      created_at:
        format: date-time
        type: string
      id:
        example: 9b2f1c3e-8d4a-4f6b-a1e2-5c7d8e9f0a1b
        format: uuid
        type: string
      position:
        description: Zero-based order of the image within the toy; new images are
          appended to the end
        example: 0
        minimum: 0
        type: integer
      toy_id:
        example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        format: uuid
        type: string
      updated_at:
        format: date-time
        type: string
      url:
        description: Public URL of the image file
        example: https://cdn.example.com/toys/7c9e6679-7425-40de-944b-e07fc1f90ae7/9b2f1c3e-8d4a-4f6b-a1e2-5c7d8e9f0a1b.jpg
        format: uri
        type: string
    type: object
  ToyInput:
    properties:
      category_name:
        description: Category name; the category is created if it does not exist
        example: Soft toys
        maxLength: 100
        minLength: 1
        type: string
      description:
        example: Soft plush bear, safe for children from 3 years
        maxLength: 2000
        minLength: 1
        type: string
      materials:
        example: Cotton, polyester filling
        maxLength: 255
        minLength: 1
        type: string
      name:
        example: Teddy bear
        maxLength: 100
        minLength: 1
        type: string
      size:
        description: Free-form size, e.g. dimensions in centimeters
        example: 25x15 cm
        maxLength: 50
        minLength: 1
        type: string
    required:
    - category_name
    - description
    - materials
    - name
    - size
    type: object
  ToyPage:
    properties:
      items:
        items:
          $ref: '#/definitions/Toy'
        type: array
      total:
        description: Total number of toys, across all pages
        example: 46
        minimum: 0
        type: integer
    type: object
  UpdateOrderInput:
    properties:
      status:
        enum:
        - open
        - closed
        example: closed
        type: string
    required:
    - status
    type: object
  UpdateUserInput:
    properties:
      email:
        description: New email; must be unique, case-insensitive
        example: user@example.com
        format: email
        maxLength: 254
        type: string
    required:
    - email
    type: object
  User:
    properties:
      created_at:
        format: date-time
        type: string
      email:
        example: user@example.com
        format: email
        type: string
      id:
        example: 62035cc3-42e5-45bc-9444-0ac5ece856bc
        format: uuid
        type: string
      updated_at:
        format: date-time
        type: string
    type: object
info:
  contact: {}
  description: API for a small handmade toy shop
  title: Kachenyatko Store API
  version: "1.0"
paths:
  /categories:
    get:
      description: Categories sorted by name, paginated with limit/offset. The response
        includes the total number of categories
      parameters:
      - default: 9
        description: Page size
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - default: 0
        description: Number of items to skip
        in: query
        minimum: 0
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/CategoryPage'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: List categories
      tags:
      - categories
    post:
      consumes:
      - application/json
      description: Create a category by name; the slug is generated from the name
      parameters:
      - description: Category to create
        in: body
        name: category
        required: true
        schema:
          $ref: '#/definitions/CategoryInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/Category'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Create category
      tags:
      - categories
  /categories/{categoryID}:
    delete:
      description: Delete a category by its ID. Fails if the category still has toys
      parameters:
      - description: Category ID
        format: uuid
        in: path
        name: categoryID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Delete category
      tags:
      - categories
    put:
      consumes:
      - application/json
      description: Rename a category by its ID; the slug is regenerated from the new
        name
      parameters:
      - description: Category ID
        format: uuid
        in: path
        name: categoryID
        required: true
        type: string
      - description: New category data
        in: body
        name: category
        required: true
        schema:
          $ref: '#/definitions/CategoryInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Category'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Update category
      tags:
      - categories
  /categories/{slug}:
    get:
      description: Get a category by its slug
      parameters:
      - description: Category slug, e.g. soft-toys
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Category'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Get category
      tags:
      - categories
  /livez:
    get:
      description: Reports that the process is running. Does not check dependencies
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/HealthResponse'
      summary: Liveness probe
      tags:
      - health
  /login:
    post:
      consumes:
      - application/json
      description: Check email and password and set an HttpOnly access_token cookie.
        Limited to 5 attempts per minute per client IP; exceeding it returns 429
      parameters:
      - description: Email and password
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/LoginInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          headers:
            Set-Cookie:
              description: access_token=<JWT>; Path=/; HttpOnly; SameSite=Lax
              type: string
          schema:
            $ref: '#/definitions/User'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Log in
      tags:
      - auth
  /logout:
    post:
      description: Clear the access_token cookie. Works without a valid session, so
        it never returns 401
      responses:
        "204":
          description: No Content
          headers:
            Set-Cookie:
              description: access_token=; Path=/; Expires=Thu, 01 Jan 1970 00:00:00
                GMT; Max-Age=0; HttpOnly; SameSite=Lax
              type: string
      summary: Log out
      tags:
      - auth
  /me:
    get:
      description: Get the logged-in user from the access_token cookie. Use it on
        page load to check whether the session is still valid
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/User'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Get current user
      tags:
      - auth
  /orders:
    get:
      description: All orders, both for catalog toys and custom ones, sorted from
        newest to oldest, paginated with limit/offset
      parameters:
      - description: Filter by order status
        enum:
        - open
        - closed
        in: query
        name: status
        type: string
      - default: 9
        description: Page size
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - default: 0
        description: Number of items to skip
        in: query
        minimum: 0
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/OrderPage'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: List orders
      tags:
      - orders
    post:
      consumes:
      - application/json
      description: Order a toy that is not in the catalog. The message describing
        the toy is required. Limited to 10 orders per 10 minutes per client IP across
        both order endpoints; exceeding it returns 429
      parameters:
      - description: Contact details and description of the toy
        in: body
        name: order
        required: true
        schema:
          $ref: '#/definitions/CreateOrderInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/Order'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Place a custom order
      tags:
      - orders
  /orders/{orderID}:
    get:
      description: Get an order by its ID, either for a catalog toy or a custom one
      parameters:
      - description: Order ID
        format: uuid
        in: path
        name: orderID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Order'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Get order
      tags:
      - orders
  /orders/{orderID}/status:
    patch:
      consumes:
      - application/json
      description: Change the status of an order by its ID
      parameters:
      - description: Order ID
        format: uuid
        in: path
        name: orderID
        required: true
        type: string
      - description: New status
        in: body
        name: status
        required: true
        schema:
          $ref: '#/definitions/UpdateOrderInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Order'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Update order status
      tags:
      - orders
  /orders/custom:
    get:
      description: Orders for toys that are not in the catalog, sorted from newest
        to oldest, paginated with limit/offset
      parameters:
      - description: Filter by order status
        enum:
        - open
        - closed
        in: query
        name: status
        type: string
      - default: 9
        description: Page size
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - default: 0
        description: Number of items to skip
        in: query
        minimum: 0
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/OrderPage'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: List custom orders
      tags:
      - orders
  /readyz:
    get:
      description: 'Reports whether the service can handle requests: pings the database
        with a timeout (DB_PING_TIMEOUT)'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/HealthResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/HealthResponse'
      summary: Readiness probe
      tags:
      - health
  /toys:
    get:
      description: Toys sorted from newest to oldest, paginated with limit/offset.
        The response includes the total number of toys
      parameters:
      - description: Filter by category slug, e.g. soft-toys
        in: query
        name: category
        type: string
      - default: 9
        description: Page size
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - default: 0
        description: Number of items to skip
        in: query
        minimum: 0
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ToyPage'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: List toys
      tags:
      - toys
    post:
      consumes:
      - application/json
      description: Create a toy. The category is matched by name and created automatically
        if it does not exist
      parameters:
      - description: Toy to create
        in: body
        name: toy
        required: true
        schema:
          $ref: '#/definitions/ToyInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/Toy'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Create toy
      tags:
      - toys
  /toys/{toyID}:
    delete:
      description: Delete a toy by its ID together with all of its images
      parameters:
      - description: Toy ID
        format: uuid
        in: path
        name: toyID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Delete toy
      tags:
      - toys
    get:
      description: Get a toy by its ID
      parameters:
      - description: Toy ID
        format: uuid
        in: path
        name: toyID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Toy'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Get toy
      tags:
      - toys
    put:
      consumes:
      - application/json
      description: Replace all fields of a toy by its ID. The category is matched
        by name and created automatically if it does not exist
      parameters:
      - description: Toy ID
        format: uuid
        in: path
        name: toyID
        required: true
        type: string
      - description: New toy data
        in: body
        name: toy
        required: true
        schema:
          $ref: '#/definitions/ToyInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Toy'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Update toy
      tags:
      - toys
  /toys/{toyID}/images:
    get:
      description: All images of a toy, sorted by position. Returns an empty array
        if the toy has no images or does not exist
      parameters:
      - description: Toy ID
        format: uuid
        in: path
        name: toyID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/ToyImage'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: List toy images
      tags:
      - toy_images
    post:
      consumes:
      - multipart/form-data
      description: Upload 1-5 images (JPEG, PNG or WebP, up to 5 MB each) in the "images"
        field. New images are appended after existing ones. A toy can have at most
        5 images in total; exceeding it returns 409
      parameters:
      - description: Toy ID
        format: uuid
        in: path
        name: toyID
        required: true
        type: string
      - description: Image files (repeat the field to upload several)
        in: formData
