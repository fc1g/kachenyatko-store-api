basePath: /
definitions:
  Category:
    properties:
      created_at:
        format: date-time
        type: string
      id:
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        format: uuid
        type: string
      name:
        example: Soft toys
        type: string
      slug:
        description: URL-friendly identifier generated from the name
        example: soft-toys
        type: string
      updated_at:
        format: date-time
        type: string
    type: object
  CategoryInput:
    properties:
      name:
        description: Category name; the slug is generated from it
        example: Soft toys
        maxLength: 100
        minLength: 1
        type: string
    required:
    - name
    type: object
  ErrorResponse:
    properties:
      code:
        description: Machine-readable error code
        enum:
        - INVALID
        - NOT_FOUND
        - CONFLICT
        - PAYLOAD_TOO_LARGE
        - INTERNAL
        example: NOT_FOUND
        type: string
      message:
        description: Human-readable error message
        example: category not found
        type: string
    type: object
  HealthResponse:
    properties:
      status:
        enum:
        - OK
        - Service Unavailable
        example: OK
        type: string
    type: object
  Toy:
    properties:
      category:
        $ref: '#/definitions/ToyCategory'
      created_at:
        format: date-time
        type: string
      description:
        example: Soft plush bear, safe for children from 3 years
        type: string
      id:
        example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        format: uuid
        type: string
      images:
        items:
          $ref: '#/definitions/ToyImage'
        type: array
      materials:
        example: Cotton, polyester filling
        type: string
      name:
        example: Teddy bear
        type: string
      size:
        description: Free-form size, e.g. dimensions in centimeters
        example: 25x15 cm
        type: string
      updated_at:
        format: date-time
        type: string
    type: object
  ToyCategory:
    properties:
      id:
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        format: uuid
        type: string
      name:
        example: Soft toys
        type: string
      slug:
        example: soft-toys
        type: string
    type: object
  ToyImage:
    properties:
      created_at:
        format: date-time
        type: string
      id:
        example: 9b2f1c3e-8d4a-4f6b-a1e2-5c7d8e9f0a1b
        format: uuid
        type: string
      position:
        description: Zero-based order of the image within the toy; new images are
          appended to the end
        example: 0
        minimum: 0
        type: integer
      toy_id:
        example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        format: uuid
        type: string
      updated_at:
        format: date-time
        type: string
      url:
        description: Public URL of the image file
        example: https://cdn.example.com/toys/7c9e6679-7425-40de-944b-e07fc1f90ae7/9b2f1c3e-8d4a-4f6b-a1e2-5c7d8e9f0a1b.jpg
        format: uri
        type: string
    type: object
  ToyInput:
    properties:
      category_name:
        description: Category name; the category is created if it does not exist
        example: Soft toys
        maxLength: 100
        minLength: 1
        type: string
      description:
        example: Soft plush bear, safe for children from 3 years
        maxLength: 2000
        minLength: 1
        type: string
      materials:
        example: Cotton, polyester filling
        maxLength: 255
        minLength: 1
        type: string
      name:
        example: Teddy bear
        maxLength: 100
        minLength: 1
        type: string
      size:
        description: Free-form size, e.g. dimensions in centimeters
        example: 25x15 cm
        maxLength: 50
        minLength: 1
        type: string
    required:
    - category_name
    - description
    - materials
    - name
    - size
    type: object
info:
  contact: {}
  description: API for a small handmade toy shop
  title: Kachenyatko Store API
  version: "1.0"
paths:
  /categories:
    get:
      description: Categories sorted by name, paginated with limit/offset
      parameters:
      - default: 20
        description: Page size
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - default: 0
        description: Number of items to skip
        in: query
        minimum: 0
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/Category'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: List categories
      tags:
      - categories
    post:
      consumes:
      - application/json
      description: Create a category by name; the slug is generated from the name
      parameters:
      - description: Category to create
        in: body
        name: category
        required: true
        schema:
          $ref: '#/definitions/CategoryInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/Category'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Create category
      tags:
      - categories
  /categories/{categoryID}:
    delete:
      description: Delete a category by its ID. Fails if the category still has toys
      parameters:
      - description: Category ID
        format: uuid
        in: path
        name: categoryID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Delete category
      tags:
      - categories
    put:
      consumes:
      - application/json
      description: Rename a category by its ID; the slug is regenerated from the new
        name
      parameters:
      - description: Category ID
        format: uuid
        in: path
        name: categoryID
        required: true
        type: string
      - description: New category data
        in: body
        name: category
        required: true
        schema:
          $ref: '#/definitions/CategoryInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Category'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Update category
      tags:
      - categories
  /categories/{slug}:
    get:
      description: Get a category by its slug
      parameters:
      - description: Category slug, e.g. soft-toys
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Category'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Get category
      tags:
      - categories
  /livez:
    get:
      description: Reports that the process is running. Does not check dependencies
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/HealthResponse'
      summary: Liveness probe
      tags:
      - health
  /readyz:
    get:
      description: 'Reports whether the service can handle requests: pings the database
        with a 2s timeout'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/HealthResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/HealthResponse'
      summary: Readiness probe
      tags:
      - health
  /toys:
    get:
      description: Toys sorted from newest to oldest, paginated with limit/offset
      parameters:
      - default: 20
        description: Page size
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - default: 0
        description: Number of items to skip
        in: query
        minimum: 0
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/Toy'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: List toys
      tags:
      - toys
    post:
      consumes:
      - application/json
      description: Create a toy. The category is matched by name and created automatically
        if it does not exist
      parameters:
      - description: Toy to create
        in: body
        name: toy
        required: true
        schema:
          $ref: '#/definitions/ToyInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/Toy'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Create toy
      tags:
      - toys
  /toys/{toyID}:
    delete:
      description: Delete a toy by its ID together with all of its images
      parameters:
      - description: Toy ID
        format: uuid
        in: path
        name: toyID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Delete toy
      tags:
      - toys
    get:
      description: Get a toy by its ID
      parameters:
      - description: Toy ID
        format: uuid
        in: path
        name: toyID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Toy'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Get toy
      tags:
      - toys
    put:
      consumes:
      - application/json
      description: Replace all fields of a toy by its ID. The category is matched
        by name and created automatically if it does not exist
      parameters:
      - description: Toy ID
        format: uuid
        in: path
        name: toyID
        required: true
        type: string
      - description: New toy data
        in: body
        name: toy
        required: true
        schema:
          $ref: '#/definitions/ToyInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Toy'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Update toy
      tags:
      - toys
  /toys/{toyID}/images:
    get:
      description: All images of a toy, sorted by position. Returns an empty array
        if the toy has no images or does not exist
      parameters:
      - description: Toy ID
        format: uuid
        in: path
        name: toyID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/ToyImage'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: List toy images
      tags:
      - toy_images
    post:
      consumes:
      - multipart/form-data
      description: Upload 1-10 images (JPEG, PNG or WebP, up to 5 MB each) in the
        "images" field. New images are appended after existing ones
      parameters:
      - description: Toy ID
        format: uuid
        in: path
        name: toyID
        required: true
        type: string
      - description: Image files (repeat the field to upload several)
        in: formData
        name: images
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            items:
              $ref: '#/definitions/ToyImage'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Upload toy images
      tags:
      - toy_images
  /toys/{toyID}/images/{imageID}:
    delete:
      description: Delete an image of a toy by its ID. The image file is also removed
        from storage
      parameters:
      - description: Toy ID
        format: uuid
        in: path
        name: toyID
        required: true
        type: string
      - description: Image ID
        format: uuid
        in: path
        name: imageID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Delete toy image
      tags:
      - toy_images
    get:
      description: Get an image of a toy by its ID
      parameters:
      - description: Toy ID
        format: uuid
        in: path
        name: toyID
        required: true
        type: string
      - description: Image ID
        format: uuid
        in: path
        name: imageID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ToyImage'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Get toy image
      tags:
      - toy_images
swagger: "2.0"
